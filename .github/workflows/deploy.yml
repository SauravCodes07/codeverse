name: Build & Deploy CodeVerse

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # LINT & TEST
  # ============================================================================

  lint:
    runs-on: ubuntu-latest
    name: Lint & Type Check
    
    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Frontend - Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Frontend - Lint
      working-directory: ./frontend
      run: npm run lint --if-present || true

    - name: Frontend - Type check
      working-directory: ./frontend
      run: npm run type-check --if-present || true

    - name: Backend - Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Backend - Lint
      working-directory: ./backend
      run: npm run lint --if-present || true

    - name: Backend - Type check
      working-directory: ./backend
      run: npm run type-check --if-present || true

  # ============================================================================
  # BUILD FRONTEND
  # ============================================================================

  build-frontend:
    runs-on: ubuntu-latest
    name: Build Frontend
    needs: lint
    
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/codeverse-frontend
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./docker/Dockerfile.frontend.prod
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ============================================================================
  # BUILD BACKEND
  # ============================================================================

  build-backend:
    runs-on: ubuntu-latest
    name: Build Backend
    needs: lint

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/codeverse-backend
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push backend
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./docker/Dockerfile.backend.prod
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ============================================================================
  # SECURITY SCANNING
  # ============================================================================

  security:
    runs-on: ubuntu-latest
    name: Security Scanning
    needs: [build-frontend, build-backend]

    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v3

    - name: Run Trivy vulnerability scanner on frontend image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/codeverse-frontend:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-frontend.sarif'
      continue-on-error: true

    - name: Run Trivy vulnerability scanner on backend image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/codeverse-backend:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-backend.sarif'
      continue-on-error: true

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-*.sarif'
      continue-on-error: true

  # ============================================================================
  # DEPLOY TO STAGING
  # ============================================================================

  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy to Staging
    needs: security
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to Railway Staging
      uses: railway-app/cli-action@v1
      with:
        token: ${{ secrets.RAILWAY_TOKEN }}
        service: codeverse-staging
      env:
        RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID_STAGING }}

    - name: Run database migrations
      run: |
        npm run migrate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}

  # ============================================================================
  # DEPLOY TO PRODUCTION
  # ============================================================================

  deploy-production:
    runs-on: ubuntu-latest
    name: Deploy to Production
    needs: security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://codeverse.io

    steps:
    - uses: actions/checkout@v3

    - name: Create deployment
      uses: actions/github-script@v6
      id: deployment
      with:
        script: |
          const deployment = await github.rest.repos.createDeployment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.ref,
            environment: 'production',
            required_contexts: [],
            auto_merge: false
          });
          return deployment.data.id;

    - name: Deploy to Kubernetes
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
        
        kubectl apply -f kubernetes/deployment.yaml
        kubectl set image deployment/backend \
          backend=${{ env.REGISTRY }}/codeverse-backend:${{ github.sha }} \
          -n codeverse
        kubectl set image deployment/frontend \
          frontend=${{ env.REGISTRY }}/codeverse-frontend:${{ github.sha }} \
          -n codeverse
        
        kubectl rollout status deployment/backend -n codeverse --timeout=5m
        kubectl rollout status deployment/frontend -n codeverse --timeout=5m

    - name: Run database migrations
      run: |
        npm run migrate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}

    - name: Smoke tests
      run: |
        curl -f https://api.codeverse.io/health || exit 1
        curl -f https://codeverse.io || exit 1

    - name: Update deployment status
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.repos.createDeploymentStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            deployment_id: ${{ steps.deployment.outputs.result }},
            state: '${{ job.status }}',
            environment_url: 'https://codeverse.io'
          });

    - name: Slack notification
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'CodeVerse Production Deployment'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author
